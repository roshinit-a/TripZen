<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – TripZen</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">

<div class="auth-card" style="max-width:520px">
    <div style="text-align:center;margin-bottom:30px">
        <a href="index.html" style="font-size:2rem;font-weight:800;color:var(--primary)">Trip<span style="color:var(--secondary)">Zen</span> ✈️</a>
    </div>
    <h2>Create Account 🚀</h2>
    <p class="subtitle">Join TripZen and start your adventure</p>

    <div id="alertContainer"></div>

    <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
            <input type="text" class="form-control" id="name" placeholder="Your full name" required minlength="2">
        </div>

        <div class="form-group">
            <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
            <label class="form-label"><i class="fas fa-phone"></i> Phone Number</label>
            <input type="tel" class="form-control" id="phone" placeholder="+91 9876543210">
        </div>

        <div class="form-group">
            <label class="form-label"><i class="fas fa-lock"></i> Password</label>
            <input type="password" class="form-control" id="password" placeholder="Min 6 characters" required minlength="6">
        </div>

        <div class="form-group">
            <label class="form-label"><i class="fas fa-lock"></i> Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="registerBtn" style="width:100%;justify-content:center;margin-top:10px">
            <i class="fas fa-user-plus"></i> Create Account
        </button>
    </form>

    <p style="text-align:center;margin-top:20px;color:var(--gray)">
        Already have an account? 
        <a href="login.html" style="color:var(--primary);font-weight:600">Login here</a>
    </p>
</div>

<script src="js/auth.js"></script>
<script>
    if (isLoggedIn()) window.location.href = 'index.html';

    async function handleRegister(e) {
        e.preventDefault();
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (pass !== confirm) {
            showAlert('alertContainer', '❌ Passwords do not match!', 'error');
            return;
        }

        const btn = document.getElementById('registerBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
        btn.disabled = true;

        try {
            const data = await apiPost('/auth/register', {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: pass
            });

            saveAuth(data);
            showAlert('alertContainer', '✅ Account created successfully! Redirecting...', 'success');
            setTimeout(() => { window.location.href = 'index.html'; }, 1200);

        } catch(err) {
            showAlert('alertContainer', '❌ ' + err.message, 'error');
            btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
