<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Packages – TripZen Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { display: flex; min-height: 100vh; background: #f0f4ff; }
        .sidebar { width: 260px; background: var(--dark); color: white; padding: 30px 0; flex-shrink: 0; min-height: 100vh; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .sidebar .brand { padding: 0 25px 30px; font-size: 1.6rem; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar .brand span { color: var(--secondary); }
        .sidebar nav a { display: flex; align-items: center; gap: 12px; padding: 13px 25px; color: #ccc; font-weight: 500; transition: var(--transition); border-left: 3px solid transparent; }
        .sidebar nav a:hover, .sidebar nav a.active { background: rgba(255,255,255,0.1); color: white; border-left-color: var(--secondary); }
        .sidebar nav a i { width: 20px; text-align: center; }
        .sidebar .logout { margin-top: auto; padding: 20px 25px 0; }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .data-table { background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .data-table .table-header { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gray-light); }
        .data-table table { width: 100%; border-collapse: collapse; }
        .data-table th { background: #f8f9ff; padding: 13px 20px; text-align: left; font-size: 0.85rem; font-weight: 700; color: var(--gray); border-bottom: 2px solid var(--gray-light); }
        .data-table td { padding: 12px 20px; font-size: 0.88rem; border-bottom: 1px solid var(--gray-light); }
        .data-table tr:hover td { background: #fafbff; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: white; border-radius: var(--radius-lg); padding: 35px; width: 90%; max-width: 550px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; color: var(--dark); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="brand">Trip<span>Zen</span> ✈️</div>
    <nav>
        <a href="admin-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="manage-users.html"><i class="fas fa-users"></i> Users</a>
        <a href="manage-destinations.html"><i class="fas fa-map-marker-alt"></i> Destinations</a>
        <a href="manage-hotels.html"><i class="fas fa-hotel"></i> Hotels</a>
        <a href="manage-packages.html" class="active"><i class="fas fa-suitcase"></i> Packages</a>
        <a href="manage-bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a>
        <a href="manage-payments.html"><i class="fas fa-credit-card"></i> Payments</a>
    </nav>
    <div class="logout">
        <button class="btn btn-danger" style="width:100%;justify-content:center" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>
</div>

<div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:25px">
        <h1 style="font-size:1.8rem;font-weight:800;color:var(--dark)">✈️ Manage Packages</h1>
        <button class="btn btn-primary" onclick="openModal()">
            <i class="fas fa-plus"></i> Add Package
        </button>
    </div>

    <div id="alertContainer"></div>

    <div class="data-table">
        <div class="table-header">
            <h3>All Travel Packages</h3>
            <input type="text" class="form-control" id="searchInput" placeholder="Search..." style="max-width:220px" oninput="filterTable()">
        </div>
        <div id="tableBody">
            <div class="spinner"></div>
        </div>
    </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle">➕ Add New Package</h2>
        <div id="modalAlert"></div>
        <form id="packageForm" onsubmit="savePackage(event)">
            <input type="hidden" id="editId">
            <div class="form-group">
                <label class="form-label">Package Name *</label>
                <input type="text" class="form-control" id="pkgName" required placeholder="E.g. Goa Beach Explorer">
            </div>
            <div class="form-group">
                <label class="form-label">Destination ID *</label>
                <input type="number" class="form-control" id="pkgDestId" required placeholder="1">
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Duration (Days) *</label>
                    <input type="number" class="form-control" id="pkgDays" required min="1" placeholder="4">
                </div>
                <div class="form-group">
                    <label class="form-label">Price (₹) *</label>
                    <input type="number" class="form-control" id="pkgPrice" required min="0" placeholder="15000">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-control" id="pkgDesc" rows="3" placeholder="Package description..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Image URL</label>
                <input type="text" class="form-control" id="pkgImage" placeholder="https://...">
            </div>
            <div class="form-group">
                <label class="form-label">Inclusions (comma-separated)</label>
                <input type="text" class="form-control" id="pkgInclusions" placeholder="Hotel Stay,Breakfast,Sightseeing">
            </div>
            <div class="form-group">
                <label class="form-label">Max Persons</label>
                <input type="number" class="form-control" id="pkgMaxPersons" placeholder="10" min="1">
            </div>
            <div style="display:flex;gap:15px;margin-top:10px">
                <button type="submit" class="btn btn-primary" id="saveBtn" style="flex:1;justify-content:center">
                    <i class="fas fa-save"></i> Save Package
                </button>
                <button type="button" class="btn btn-outline" onclick="closeModal()" style="flex:1;justify-content:center">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/auth.js"></script>
<script>
    if (!isLoggedIn() || !isAdmin()) window.location.href = '../login.html';

    let packages = [];

    async function loadPackages() {
        try {
            packages = await apiGet('/packages');
            renderTable(packages);
        } catch(e) {
            packages = [
                {id:1, name:'Goa Beach Explorer', durationDays:4, price:15000, destination:{name:'Goa'}, isActive:true},
                {id:2, name:'Manali Snow Adventure', durationDays:5, price:20000, destination:{name:'Manali'}, isActive:true},
                {id:3, name:'Jaipur Royal Heritage', durationDays:3, price:12000, destination:{name:'Jaipur'}, isActive:true},
            ];
            renderTable(packages);
        }
    }

    function renderTable(data) {
        document.getElementById('tableBody').innerHTML = `
            <table>
                <thead>
                    <tr><th>#</th><th>Package Name</th><th>Destination</th><th>Duration</th><th>Price</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    ${data.map(p => `
                        <tr>
                            <td>#${p.id}</td>
                            <td><strong>${p.name}</strong></td>
                            <td>📍 ${p.destination?.name || '—'}</td>
                            <td>${p.durationDays} Days</td>
                            <td><strong>${formatCurrency(p.price)}</strong></td>
                            <td>${p.isActive !== false ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-danger">Inactive</span>'}</td>
                            <td>
                                <button class="btn" style="background:#cce5ff;color:#004085;padding:5px 12px;font-size:0.8rem" onclick="editPackage(${p.id})">✏️ Edit</button>
                                <button class="btn btn-danger" style="padding:5px 12px;font-size:0.8rem;margin-left:5px" onclick="deletePackage(${p.id})">🗑️ Delete</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    function filterTable() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        renderTable(packages.filter(p => p.name.toLowerCase().includes(q) || (p.destination?.name || '').toLowerCase().includes(q)));
    }

    function openModal(pkg = null) {
        document.getElementById('modalTitle').textContent = pkg ? '✏️ Edit Package' : '➕ Add New Package';
        document.getElementById('editId').value = pkg?.id || '';
        document.getElementById('pkgName').value = pkg?.name || '';
        document.getElementById('pkgDestId').value = pkg?.destination?.id || '';
        document.getElementById('pkgDays').value = pkg?.durationDays || '';
        document.getElementById('pkgPrice').value = pkg?.price || '';
        document.getElementById('pkgDesc').value = pkg?.description || '';
        document.getElementById('pkgImage').value = pkg?.imageUrl || '';
        document.getElementById('pkgInclusions').value = pkg?.inclusions || '';
        document.getElementById('pkgMaxPersons').value = pkg?.maxPersons || '';
        document.getElementById('modalOverlay').classList.add('show');
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('show');
        document.getElementById('modalAlert').innerHTML = '';
    }

    function editPackage(id) {
        const pkg = packages.find(p => p.id === id);
        if (pkg) openModal(pkg);
    }

    async function savePackage(e) {
        e.preventDefault();
        const btn = document.getElementById('saveBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        btn.disabled = true;

        const id = document.getElementById('editId').value;
        const payload = {
            name: document.getElementById('pkgName').value,
            durationDays: parseInt(document.getElementById('pkgDays').value),
            price: parseFloat(document.getElementById('pkgPrice').value),
            description: document.getElementById('pkgDesc').value,
            imageUrl: document.getElementById('pkgImage').value,
            inclusions: document.getElementById('pkgInclusions').value,
            maxPersons: parseInt(document.getElementById('pkgMaxPersons').value) || 10,
            isActive: true,
            destination: { id: parseInt(document.getElementById('pkgDestId').value) }
        };

        try {
            if (id) {
                await apiPut(`/packages/${id}`, payload);
                showAlert('alertContainer', '✅ Package updated!', 'success');
            } else {
                await apiPost('/packages', payload, true);
                showAlert('alertContainer', '✅ Package added!', 'success');
            }
            closeModal();
            loadPackages();
        } catch(err) {
            document.getElementById('modalAlert').innerHTML = `<div class="alert alert-error">❌ ${err.message}</div>`;
        }

        btn.innerHTML = '<i class="fas fa-save"></i> Save Package';
        btn.disabled = false;
    }

    async function deletePackage(id) {
        if (!confirm('Delete this package?')) return;
        try {
            await apiDelete(`/packages/${id}`);
            showAlert('alertContainer', '✅ Package deleted.', 'success');
            loadPackages();
        } catch(e) {
            showAlert('alertContainer', '❌ Delete failed.', 'error');
        }
    }

    loadPackages();
</script>
</body>
</html>
