<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users – TripZen Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { display: flex; min-height: 100vh; background: #f0f4ff; }
        .sidebar { width: 260px; background: var(--dark); color: white; padding: 30px 0; flex-shrink: 0; min-height: 100vh; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .sidebar .brand { padding: 0 25px 30px; font-size: 1.6rem; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar .brand span { color: var(--secondary); }
        .sidebar nav a { display: flex; align-items: center; gap: 12px; padding: 13px 25px; color: #ccc; font-weight: 500; transition: var(--transition); border-left: 3px solid transparent; }
        .sidebar nav a:hover, .sidebar nav a.active { background: rgba(255,255,255,0.1); color: white; border-left-color: var(--secondary); }
        .sidebar nav a i { width: 20px; text-align: center; }
        .sidebar .logout { margin-top: auto; padding: 20px 25px 0; }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .data-table { background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .data-table .table-header { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gray-light); }
        .data-table table { width: 100%; border-collapse: collapse; }
        .data-table th { background: #f8f9ff; padding: 13px 20px; text-align: left; font-size: 0.85rem; font-weight: 700; color: var(--gray); border-bottom: 2px solid var(--gray-light); }
        .data-table td { padding: 12px 20px; font-size: 0.88rem; border-bottom: 1px solid var(--gray-light); }
        .data-table tr:hover td { background: #fafbff; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="brand">Trip<span>Zen</span> ✈️</div>
    <nav>
        <a href="admin-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="manage-users.html" class="active"><i class="fas fa-users"></i> Users</a>
        <a href="manage-destinations.html"><i class="fas fa-map-marker-alt"></i> Destinations</a>
        <a href="manage-hotels.html"><i class="fas fa-hotel"></i> Hotels</a>
        <a href="manage-packages.html"><i class="fas fa-suitcase"></i> Packages</a>
        <a href="manage-bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a>
        <a href="manage-payments.html"><i class="fas fa-credit-card"></i> Payments</a>
    </nav>
    <div class="logout">
        <button class="btn btn-danger" style="width:100%;justify-content:center" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>
</div>

<div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:25px">
        <h1 style="font-size:1.8rem;font-weight:800;color:var(--dark)">👥 Manage Users</h1>
    </div>
    <div id="alertContainer"></div>
    <div class="data-table">
        <div class="table-header">
            <h3>All Registered Users</h3>
            <input type="text" class="form-control" id="searchInput" placeholder="Search..." style="max-width:220px" oninput="filterTable()">
        </div>
        <div id="tableBody"><div class="spinner"></div></div>
    </div>
</div>

<script src="../js/auth.js"></script>
<script>
    if (!isLoggedIn() || !isAdmin()) window.location.href = '../login.html';

    let users = [];

    async function loadUsers() {
        try {
            users = await apiGet('/users');
            renderTable(users);
        } catch(e) {
            users = [
                {id:1, name:'Deepak Kumar', email:'deepak@gmail.com', phone:'9876543210', role:'USER', createdAt:'2024-01-15'},
                {id:2, name:'Rahul Singh', email:'rahul@gmail.com', phone:'9876543211', role:'USER', createdAt:'2024-02-20'},
                {id:3, name:'Admin User', email:'admin@tripzen.com', phone:'9000000000', role:'ADMIN', createdAt:'2024-01-01'},
            ];
            renderTable(users);
        }
    }

    function renderTable(data) {
        document.getElementById('tableBody').innerHTML = `
            <table>
                <thead>
                    <tr><th>#ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Joined</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    ${data.map(u => `
                        <tr>
                            <td>#${u.id}</td>
                            <td><strong>${u.name}</strong></td>
                            <td>${u.email}</td>
                            <td>${u.phone || '—'}</td>
                            <td>${u.role === 'ADMIN'
                                ? '<span class="badge badge-primary">ADMIN</span>'
                                : '<span class="badge badge-success">USER</span>'}</td>
                            <td>${u.createdAt ? formatDate(u.createdAt) : '—'}</td>
                            <td>
                                ${u.role !== 'ADMIN' ? `
                                    <button class="btn btn-danger" style="padding:5px 12px;font-size:0.8rem" onclick="deleteUser(${u.id}, '${u.name}')">
                                        🗑️ Delete
                                    </button>
                                ` : '<span style="color:#aaa;font-size:0.85rem">Protected</span>'}
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    function filterTable() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        renderTable(users.filter(u =>
            u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)
        ));
    }

    async function deleteUser(id, name) {
        if (!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
        try {
            await apiDelete(`/users/${id}`);
            showAlert('alertContainer', '✅ User deleted.', 'success');
            loadUsers();
        } catch(e) {
            showAlert('alertContainer', '❌ Failed to delete user.', 'error');
        }
    }

    loadUsers();
</script>
</body>
</html>
