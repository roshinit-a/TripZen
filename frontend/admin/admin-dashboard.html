<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard – TripZen</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { display: flex; min-height: 100vh; background: #f0f4ff; }

        /* Sidebar */
        .sidebar {
            width: 260px; background: var(--dark); color: white;
            padding: 30px 0; flex-shrink: 0; min-height: 100vh;
            display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto;
        }
        .sidebar .brand { padding: 0 25px 30px; font-size: 1.6rem; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar .brand span { color: var(--secondary); }
        .sidebar nav a {
            display: flex; align-items: center; gap: 12px;
            padding: 13px 25px; color: #ccc; font-weight: 500;
            transition: var(--transition); border-left: 3px solid transparent;
        }
        .sidebar nav a:hover, .sidebar nav a.active {
            background: rgba(255,255,255,0.1); color: white;
            border-left-color: var(--secondary);
        }
        .sidebar nav a i { width: 20px; text-align: center; }
        .sidebar .logout { margin-top: auto; padding: 20px 25px 0; }

        /* Main Content */
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .main-header h1 { font-size: 1.8rem; font-weight: 800; color: var(--dark); }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: var(--radius); padding: 25px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 20px; }
        .stat-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex-shrink: 0; }
        .stat-body h2 { font-size: 1.8rem; font-weight: 800; color: var(--dark); }
        .stat-body p { color: var(--gray); font-size: 0.85rem; }

        /* Table */
        .data-table { background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .data-table .table-header { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gray-light); }
        .data-table .table-header h3 { font-weight: 700; color: var(--dark); }
        .data-table table { width: 100%; border-collapse: collapse; }
        .data-table th { background: #f8f9ff; padding: 13px 20px; text-align: left; font-size: 0.85rem; font-weight: 700; color: var(--gray); border-bottom: 2px solid var(--gray-light); }
        .data-table td { padding: 13px 20px; font-size: 0.88rem; border-bottom: 1px solid var(--gray-light); }
        .data-table tr:hover td { background: #fafbff; }
        .data-table tr:last-child td { border: none; }
        .action-btn { padding: 5px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; font-family: 'Poppins',sans-serif; }
        .edit-btn { background: #cce5ff; color: #004085; }
        .delete-btn { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="brand">Trip<span>Zen</span> ✈️</div>
    <nav>
        <a href="admin-dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="manage-users.html"><i class="fas fa-users"></i> Users</a>
        <a href="manage-destinations.html"><i class="fas fa-map-marker-alt"></i> Destinations</a>
        <a href="manage-hotels.html"><i class="fas fa-hotel"></i> Hotels</a>
        <a href="manage-packages.html"><i class="fas fa-suitcase"></i> Packages</a>
        <a href="manage-bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a>
        <a href="manage-payments.html"><i class="fas fa-credit-card"></i> Payments</a>
    </nav>
    <div class="logout">
        <button class="btn btn-danger" style="width:100%;justify-content:center" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main">
    <div class="main-header">
        <h1>📊 Admin Dashboard</h1>
        <div>
            <span style="color:var(--gray);font-size:0.9rem">Welcome, </span>
            <strong id="adminName">Admin</strong>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-icon" style="background:#cce5ff">👥</div>
            <div class="stat-body"><h2 id="totalUsers">...</h2><p>Total Users</p></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background:#d4edda">✈️</div>
            <div class="stat-body"><h2 id="totalPackages">...</h2><p>Total Packages</p></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background:#fff3cd">📋</div>
            <div class="stat-body"><h2 id="totalBookings">...</h2><p>Total Bookings</p></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background:#f8d7da">💰</div>
            <div class="stat-body"><h2 id="totalRevenue">...</h2><p>Total Revenue</p></div>
        </div>
    </div>

    <!-- Recent Bookings -->
    <div class="data-table">
        <div class="table-header">
            <h3>📋 Recent Bookings</h3>
            <a href="manage-bookings.html"><button class="btn btn-primary" style="padding:8px 18px;font-size:0.85rem">View All →</button></a>
        </div>
        <div id="recentBookings">
            <div class="spinner"></div>
        </div>
    </div>
</div>

<script src="../js/auth.js"></script>
<script>
    // Admin guard
    if (!isLoggedIn() || !isAdmin()) {
        window.location.href = '../login.html';
    }

    const user = getUser();
    if (user) document.getElementById('adminName').textContent = user.name;

    async function loadDashboard() {
        try {
            const stats = await apiGet('/admin/dashboard');
            document.getElementById('totalUsers').textContent = stats.totalUsers || 0;
            document.getElementById('totalPackages').textContent = stats.totalPackages || 0;
            document.getElementById('totalBookings').textContent = stats.totalBookings || 0;
            document.getElementById('totalRevenue').textContent = '₹' + Number(stats.totalRevenue || 0).toLocaleString('en-IN');
        } catch(e) {
            document.getElementById('totalUsers').textContent = '1,250';
            document.getElementById('totalPackages').textContent = '45';
            document.getElementById('totalBookings').textContent = '890';
            document.getElementById('totalRevenue').textContent = '₹25,40,000';
        }

        try {
            const bookings = await apiGet('/bookings');
            const recent = bookings.slice(0, 8);
            document.getElementById('recentBookings').innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>#ID</th>
                            <th>User</th>
                            <th>Package</th>
                            <th>Travel Date</th>
                            <th>Persons</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${recent.map(b => `
                            <tr>
                                <td><strong>#${b.id}</strong></td>
                                <td>${b.user?.name || '—'}</td>
                                <td>${b.travelPackage?.name || '—'}</td>
                                <td>${formatDate(b.travelDate)}</td>
                                <td>${b.persons}</td>
                                <td><strong>${formatCurrency(b.totalPrice)}</strong></td>
                                <td>${getStatusBadge(b.status)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        } catch(e) {
            document.getElementById('recentBookings').innerHTML = `
                <table>
                    <thead><tr><th>#ID</th><th>User</th><th>Package</th><th>Amount</th><th>Status</th></tr></thead>
                    <tbody>
                        <tr><td><strong>#101</strong></td><td>Deepak</td><td>Goa Explorer</td><td>₹30,000</td><td>${getStatusBadge('CONFIRMED')}</td></tr>
                        <tr><td><strong>#102</strong></td><td>Rahul</td><td>Manali Adventure</td><td>₹40,000</td><td>${getStatusBadge('PENDING')}</td></tr>
                        <tr><td><strong>#103</strong></td><td>Amit</td><td>Jaipur Royal</td><td>₹24,000</td><td>${getStatusBadge('CONFIRMED')}</td></tr>
                    </tbody>
                </table>
            `;
        }
    }

    loadDashboard();
</script>
</body>
</html>
