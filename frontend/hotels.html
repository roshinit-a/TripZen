<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotels – TripZen</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .hotel-card { display: flex; gap: 20px; background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: var(--transition); }
        .hotel-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
        .hotel-card img { width: 220px; height: 160px; object-fit: cover; flex-shrink: 0; }
        .hotel-card .hotel-body { padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .hotel-name { font-size: 1.2rem; font-weight: 700; color: var(--dark); margin-bottom: 5px; }
        .hotel-location { color: var(--gray); font-size: 0.9rem; margin-bottom: 8px; }
        .hotel-rooms { font-size: 0.85rem; color: var(--success); font-weight: 500; }
        .filter-bar { display: flex; gap: 15px; align-items: center; background: white; padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 30px; flex-wrap: wrap; }
        .hotels-list { display: flex; flex-direction: column; gap: 20px; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">Trip<span>Zen</span> ✈️</a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="hotels.html" class="active">Hotels</a></li>
        <li><a href="packages.html">Packages</a></li>
        <li><a href="my-bookings.html">My Bookings</a></li>
    </ul>
    <div style="display:flex;gap:12px;align-items:center">
        <a href="login.html" id="navLogin"><button class="btn btn-outline">Login</button></a>
        <div id="navUser" style="display:flex;gap:10px;align-items:center"></div>
    </div>
</nav>

<div class="page-header">
    <h1>🏨 Hotels</h1>
    <p>Find the perfect stay for your trip</p>
</div>

<section class="section">
    <div class="filter-bar">
        <input type="text" class="form-control" id="searchInput" placeholder="🔍 Search hotels..." style="max-width:250px" oninput="filterHotels()">
        <select class="form-control" id="ratingFilter" style="max-width:180px" onchange="filterHotels()">
            <option value="">⭐ All Ratings</option>
            <option value="4">4+ Stars</option>
            <option value="3">3+ Stars</option>
        </select>
        <select class="form-control" id="priceFilter" style="max-width:180px" onchange="filterHotels()">
            <option value="">💰 All Prices</option>
            <option value="3000">Under ₹3,000</option>
            <option value="5000">Under ₹5,000</option>
            <option value="10000">Under ₹10,000</option>
        </select>
        <span style="color:var(--gray);font-size:0.9rem" id="countDisplay">Loading...</span>
    </div>

    <div class="hotels-list" id="hotelsGrid">
        <div class="spinner"></div>
    </div>
</section>

<footer style="background:var(--dark);color:#ccc;padding:25px 5%;text-align:center">
    <p>&copy; 2024 TripZen. All rights reserved.</p>
</footer>

<script src="js/auth.js"></script>
<script>
    let allHotels = [];

    async function loadHotels() {
        try {
            allHotels = await fetch(`${API_BASE}/hotels`).then(r => r.json());
            renderHotels(allHotels);
        } catch(e) {
            allHotels = [
                {id:1, name:'The Grand Goa Resort', location:'North Goa', pricePerNight:4500, rating:4.5, availableRooms:8, description:'Luxury beachside resort with stunning ocean views.', imageUrl:'https://images.unsplash.com/photo-1571003123894-1f0594d2b5d9?w=400', destination:{name:'Goa'}},
                {id:2, name:'Manali Snow Peak Hotel', location:'Mall Road, Manali', pricePerNight:3200, rating:4.2, availableRooms:12, description:'Cozy mountain hotel with Himalayan views.', imageUrl:'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=400', destination:{name:'Manali'}},
                {id:3, name:'Jaipur Palace Inn', location:'Civil Lines, Jaipur', pricePerNight:2800, rating:4.0, availableRooms:20, description:'Heritage hotel with traditional Rajasthani decor.', imageUrl:'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400', destination:{name:'Jaipur'}},
                {id:4, name:'Kerala Backwater Villa', location:'Alleppey, Kerala', pricePerNight:5500, rating:4.8, availableRooms:5, description:'Premium villa with direct backwater access.', imageUrl:'https://images.unsplash.com/photo-1578683010236-d716f9a3f461?w=400', destination:{name:'Kerala'}},
                {id:5, name:'Darjeeling Tea Garden Resort', location:'Darjeeling Hills', pricePerNight:3800, rating:4.3, availableRooms:10, description:'Surrounded by lush tea gardens with mountain views.', imageUrl:'https://images.unsplash.com/photo-1523592121529-f6dde35f079e?w=400', destination:{name:'Darjeeling'}},
            ];
            renderHotels(allHotels);
        }
    }

    function renderHotels(hotels) {
        const grid = document.getElementById('hotelsGrid');
        document.getElementById('countDisplay').textContent = `${hotels.length} hotels found`;
        if (!hotels.length) { grid.innerHTML = '<p style="color:var(--gray)">No hotels found.</p>'; return; }
        grid.innerHTML = hotels.map(h => `
            <div class="hotel-card">
                <img src="${h.imageUrl || 'https://images.unsplash.com/photo-1564501049412-61c2a3083791?w=300'}" 
                     alt="${h.name}" onerror="this.src='https://images.unsplash.com/photo-1564501049412-61c2a3083791?w=300'">
                <div class="hotel-body">
                    <div>
                        <div class="hotel-name">🏨 ${h.name}</div>
                        <div class="hotel-location">📍 ${h.location}${h.destination ? ' — ' + h.destination.name : ''}</div>
                        <div style="margin-bottom:8px">${renderStars(h.rating || 4)}</div>
                        <p style="font-size:0.85rem;color:var(--gray);margin-bottom:8px">${h.description || ''}</p>
                        <div class="hotel-rooms">✅ ${h.availableRooms || 0} rooms available</div>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px">
                        <div>
                            <span class="price">${formatCurrency(h.pricePerNight)}</span>
                            <span class="price-small"> /night</span>
                        </div>
                        <a href="packages.html${h.destination ? '?destination=' + (h.destination.id || '') : ''}">
                            <button class="btn btn-primary" style="padding:8px 18px;font-size:0.85rem">View Packages</button>
                        </a>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function filterHotels() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const rating = parseFloat(document.getElementById('ratingFilter').value) || 0;
        const price = parseFloat(document.getElementById('priceFilter').value) || Infinity;
        renderHotels(allHotels.filter(h =>
            (h.name.toLowerCase().includes(q) || (h.location && h.location.toLowerCase().includes(q))) &&
            (h.rating || 0) >= rating &&
            (h.pricePerNight || 0) <= price
        ));
    }

    loadHotels();
</script>
</body>
</html>
