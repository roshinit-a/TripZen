# ==============================
# TripZen Application Properties
# ==============================

# Server Port
server.port=8080

# Allow frontend to connect
server.servlet.context-path=/

# ==============================
# MySQL Database Configuration
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/tripzen_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=26748
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate Configuration
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT Configuration
# ==============================
jwt.secret=TripZenSecretKey2024VeryLongAndSecureSecretKeyForJWTGeneration
jwt.expiration=86400000

# ==============================
# CORS Configuration
# ==============================
spring.web.cors.allowed-origins=*

# ==============================
# Logging
# ==============================
logging.level.com.tripzen=DEBUG
logging.level.org.springframework.security=DEBUG
